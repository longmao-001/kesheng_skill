# 科生统一知识图谱 Schema（并集KG · 分区domain）

> 由 scripts/build_union_kg.py 从域片段自动汇总。domain=真实剧组建制(11域)。
> 实体 id 规范: `Type:名称`；每节点含 domains(归属域列表)。关系含 domains(取源实体域)。

