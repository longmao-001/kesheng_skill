# ============================================================
# 领域知识图谱 Pack Schema — 科生 · 视觉导演 (director-kg)
# ============================================================
schema_version: "1.0"
pack: director-kg
role: 视觉导演

# ------------------------------------------------------------
# 实体类型表 (type / 说明 / 示例id)
# ------------------------------------------------------------
# 复合主键约定：id = `<类型英文名>:<中文名称>`，例如 `CameraMove:推`。
entity_types:
  ShotType:
    说明: 景别（远/全/中/近/特的叙事作用、参考焦段、景别动线）
    示例id: "ShotType:特写"
  CameraMove:
    说明: 运镜型（英文名对照、情绪效果、适用场景；含 17 种运镜与转场衔接）
    示例id: "CameraMove:环绕"
  Transition:
    说明: 转场/衔接方式（硬切/匹配剪辑/粒子消散等，及其情绪与节奏效果）
    示例id: "Transition:匹配剪辑"
  VisualMetaphor:
    说明: 视觉隐喻与招牌镜头（微观穿越/宏观俯瞰/数据动起来/过程演示/工程隐喻等）
    示例id: "VisualMetaphor:微观穿越"
  ViStyle:
    说明: 视觉风格规范（VI 模板/风格要点/色彩字体禁忌/风格 token 块）
    示例id: "ViStyle:自然暖色调VI模板"
  FeasibilityRule:
    说明: 可拍性约束（精确结构首帧图+图生视频/单镜≤10s/≤2运镜/匀速单运镜不合格等）
    示例id: "FeasibilityRule:匀速单运镜不合格"
  MovingTechnique:
    说明: 动感技法（运镜变速/复合运镜/画面内部运动/剪辑节奏/相邻镜动势衔接）
    示例id: "MovingTechnique:运镜变速"
  GridTechnique:
    说明: 宫格分镜技法（Image2 生图/九宫格/整图成片或切片首帧/单格微调）
    示例id: "GridTechnique:九宫格分镜图"
  Mood:
    说明: 情绪效果（运镜/转场传达的情绪基调，作为 move-conveys-mood 关系靶点）
    示例id: "Mood:史诗规模"
  Beat:
    说明: 叙事节拍/景别功能（建立场景/推进信息/情绪数据/景别动线，作为 shottype-for-beat 关系靶点）
    示例id: "Beat:推进信息节拍"
  Concept:
    说明: 抽象科学/表达概念（微观结构/宏观规模/数据指标/过程机理/工程结构等，作为 metaphor-for-concept 关系靶点）
    示例id: "Concept:微观结构"
  Gate:
    说明: 质量门控检查点（镜头动感门控/M4 出口门控/可拍性门控，作为 rule-enforced-in-gate 关系靶点）
    示例id: "Gate:镜头动感门控"
  Scenario:
    说明: 应用场景（申报答辩/公众科普/产业商业，作为 style-applied-to 关系靶点）
    示例id: "Scenario:公众科普场景"

# ------------------------------------------------------------
# 关系类型表 (type / 说明)
# ------------------------------------------------------------
relation_types:
  move-conveys-mood:
    说明: 运镜/转场传达某种情绪效果（源=运镜或转场，靶=情绪）
  shottype-for-beat:
    说明: 某种景别承担某种叙事节拍/功能（源=景别，靶=叙事节拍）
  metaphor-for-concept:
    说明: 视觉隐喻/招牌镜头用于表达某抽象概念（源=视觉隐喻，靶=概念）
  style-set-constraint:
    说明: 某视觉风格规范设定某生产可拍性约束（源=风格规范，靶=可拍性约束）
  rule-enforced-in-gate:
    说明: 某可拍性约束在某个质量门控环节被强制检查（源=可拍性约束，靶=门控）
  technique-for-avoiding:
    说明: 某动感技法用于规避某失败/不合格情形（源=动感技法，靶=可拍性约束/失败判据）
  grid-for-previz:
    说明: 某宫格分镜技法用于前期可视化和镜头节拍定型（源=宫格技法，靶=叙事节拍）
  style-applied-to:
    说明: 某视觉风格规范适用于某应用场景 （源=风格规范，靶=应用场景）

# ------------------------------------------------------------
# 复合主键约定
# ------------------------------------------------------------
id_convention: "id = `<类型英文名>:<中文名称>`；类型英文名取上表实体类型键（如 CameraMove、FeasibilityRule）。id 在包内唯一。"

# ------------------------------------------------------------
# 包说明
# ------------------------------------------------------------
pack_desc: |
  角色：视觉导演（Director）—— 科生科研视频团队的视觉负责人。
  定位：把文稿/脚本翻译成可执行的分镜表（景别、运镜、时长、画面内容），并保证 AI 视频工具真正做得出来（可拍性）。
  构建来源：F:/AI/kesheng/ 下团队沉淀的知识/工艺/角色卡/手册——
    knowledge/camera-language.md（镜头语言百科）、knowledge/动感三来源.md、knowledge/产品开场语法.md、
    knowledge/vi_styles/vi-style-templates.md（VI 规范模板库）、knowledge/图表层.md、
    knowledge/tvc-ad-templates.md（TVC/带货分镜骨架，只取分镜骨架/视觉相关）、
    playbooks/storyboard-grid.md（宫格分镜）、playbooks/consistency.md（跨镜头一致性）、
    agents/director.md（视觉导演角色卡，权威正文）、knowledge/index.md（精化索引：视觉与运镜/一致性行）。
  更新规则：
    - 权威正文永远在原文件（playbooks/agents/protocols），本包只做"实体+要点+出处链接"的概念化沉淀，不改写原文，防止两处走样。
    - 项目收尾时萃取：把新项目验证过的镜头/运镜/隐喻/可拍性心得，逆向写回对应实体 props 或新增实体（参照 e.g. 动感三来源.md 的"项目验证"行）。
    - 本领域无外部API可富集，内容来自团队沉淀，新知识由项目收尾萃取循环补充。
